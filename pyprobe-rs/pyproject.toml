[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyprobe-rs"
dynamic = ["version"]
description = "Python bindings for the probe-rs embedded debugging toolkit"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }

[tool.maturin]
module-name = "pyprobe_rs._pyprobe_rs"
features = ["espressif"]
python-source = "python"

[tool.pytest.ini_options]
markers = [
    # Hardware-in-the-loop suite (tests/test_hil.py): skipped without
    # PYPROBE_RS_PY_HIL_CONFIG; select explicitly with `-m hil`.
    "hil: hardware-in-the-loop tests; need a DUT TOML (PYPROBE_RS_PY_HIL_CONFIG) and real probe hardware",
    # Also gated by PYPROBE_RS_PY_FLASH_WEAR=1 inside the test itself.
    "wear: consumes real flash erase/program cycles on the DUT",
]
